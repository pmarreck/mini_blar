name: "Publish every Git push to yolo to FlakeHub"
on:
  push:
    branches:
      - "yolo"
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a"
        with:
          persist-credentials: false
      - uses: "DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a"
      - uses: "DeterminateSystems/flakehub-push@8877c5e4ef4c5e43464be0d7529077cadf39ae36"
        with:
          name: "pmarreck/mini_blar"
          rolling: true
          visibility: "public"
          include-output-paths: true
